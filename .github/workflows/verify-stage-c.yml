name: Stage C validation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stage A and B preview regression
        run: node tests/verify-preview.mjs
      - name: Stage C PNG metadata fixtures
        run: node tests/verify-png.mjs
      - name: Stage D character positions
        run: node tests/verify-characters.mjs
      - name: Stage E image recycle safety
        run: node tests/verify-images.mjs
